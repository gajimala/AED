<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AED API 단독 테스트</title>
<style>
  body{font-family:-apple-system,sans-serif;padding:16px;background:#F4F7FA;color:#12222E;}
  h1{font-size:18px;}
  button{background:#0FA3B1;color:#fff;border:none;border-radius:8px;padding:14px 20px;font-size:15px;font-weight:700;width:100%;margin-bottom:16px;}
  #result{background:#fff;border:1px solid #E1E8ED;border-radius:10px;padding:14px;font-size:13px;white-space:pre-wrap;word-break:break-all;line-height:1.6;}
  .ok{color:#1E8E5A;font-weight:700;}
  .err{color:#E4572E;font-weight:700;}
</style>
</head>
<body>

<h1>🚑 AED API 단독 테스트</h1>
<p style="font-size:13px;color:#5B6B76;">파이어베이스, 지도, 다른 코드 전혀 없이 이 API 호출 하나만 테스트합니다.</p>
<button onclick="testAed()">지금 호출해보기 (강원 강릉시)</button>
<div id="result">여기에 결과가 표시됩니다.</div>

<script>
const AED_SERVICE_KEY_ENCODED = 'TUbUhIiFWVRorR5hyktEuzY05oGV0Wd%2FTohPPdjOB27lUHRN521Oc6cJD%2BityxwoJzleTCzC%2BBYOroBVoyOxhA%3D%3D';
const AED_API_URL = 'https://apis.data.go.kr/B552657/AEDInfoInqireService/getEgytAedManageInfoInqire';

async function testAed(){
  const box = document.getElementById('result');
  box.innerHTML = '⏳ 호출 중...';
  const url = `${AED_API_URL}?serviceKey=${AED_SERVICE_KEY_ENCODED}&Q0=강원특별자치도&Q1=강릉시&pageNo=1&numOfRows=5`;
  try{
    const res = await fetch(url);
    box.innerHTML = `<span class="${res.ok ? 'ok' : 'err'}">HTTP 상태: ${res.status}</span>\n\n`;
    const text = await res.text();
    box.innerHTML += '응답 내용 (처음 1500자):\n' + text.slice(0, 1500);
  }catch(e){
    box.innerHTML = `<span class="err">❌ 요청 자체가 실패했습니다</span>\n\n`;
    box.innerHTML += `에러 이름: ${e.name}\n에러 메시지: ${e.message}\n\n`;
    box.innerHTML += `이게 "Failed to fetch"이면 CORS 차단이 거의 확실합니다.`;
  }
}
</script>
</body>
</html>
